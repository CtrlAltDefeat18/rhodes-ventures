<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>Dashboard — Rhodes Ventures</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --purple-900:#1e0a4a; --purple-800:#3d1a80; --purple-600:#6d40c4;
    --purple-400:#9b7fe8; --purple-200:#d9d0ff; --purple-100:#f0ecff;
    --text:#1a1025; --text-mid:#4a4060; --text-soft:#8a7fa0;
    --rule:#e8e4f0; --white:#fff; --off:#fafafa;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--off); color: var(--text); min-height: 100vh; }

  /* Nav */
  nav { position: sticky; top: 0; z-index: 100; background: var(--white); border-bottom: 1px solid var(--rule); padding: 0 48px; height: 64px; display: flex; align-items: center; justify-content: space-between; }
  .nav-brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit; }
  .nav-mark { width: 32px; height: 32px; background: var(--purple-800); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; font-family: 'Cormorant Garamond', serif; font-size: 16px; font-weight: 700; }
  .nav-brand strong { font-size: 13px; font-weight: 600; }
  .nav-right { display: flex; align-items: center; gap: 16px; }
  .nav-user { font-size: 13px; color: var(--text-soft); }
  .nav-btn { padding: 8px 18px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; border: 1px solid var(--rule); background: transparent; color: var(--text-mid); transition: all 0.2s; }
  .nav-btn:hover { background: var(--off); }
  .nav-btn.primary { background: var(--purple-800); color: white; border-color: transparent; }
  .nav-btn.primary:hover { background: var(--purple-600); }

  /* Layout */
  .page { max-width: 1100px; margin: 0 auto; padding: 48px; }

  /* Banner: admin prefill notice */
  .prefill-banner { background: #fffbeb; border: 1px solid #fde68a; border-radius: 12px; padding: 16px 20px; margin-bottom: 32px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .prefill-banner p { font-size: 13px; color: #92400e; }
  .prefill-banner a { font-weight: 700; color: #92400e; text-decoration: none; }
  .prefill-banner.hide { display: none; }

  /* Header */
  .dash-header { margin-bottom: 40px; }
  .dash-greeting { font-family: 'Cormorant Garamond', serif; font-size: 36px; font-weight: 300; margin-bottom: 4px; }
  .dash-sub { font-size: 14px; color: var(--text-soft); }

  /* Cards grid */
  .cards-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 40px; }
  .stat-card { background: var(--white); border: 1px solid var(--rule); border-radius: 16px; padding: 24px; }
  .stat-label { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-soft); margin-bottom: 10px; }
  .stat-val { font-family: 'Cormorant Garamond', serif; font-size: 38px; font-weight: 600; color: var(--text); line-height: 1; }
  .stat-sub { font-size: 12px; color: var(--text-soft); margin-top: 6px; }
  .stat-card.highlight { background: linear-gradient(135deg, var(--purple-900), var(--purple-700, #5b30b0)); border-color: transparent; }
  .stat-card.highlight .stat-label { color: rgba(255,255,255,0.5); }
  .stat-card.highlight .stat-val { color: white; }
  .stat-card.highlight .stat-sub { color: rgba(255,255,255,0.5); }

  /* Completeness ring */
  .completeness-wrap { display: flex; align-items: center; gap: 16px; }
  .ring { width: 60px; height: 60px; flex-shrink: 0; }
  .ring-bg { fill: none; stroke: var(--purple-200); stroke-width: 4; }
  .ring-fill { fill: none; stroke: var(--purple-600); stroke-width: 4; stroke-linecap: round; transform: rotate(-90deg); transform-origin: center; transition: stroke-dashoffset 1s ease; }

  /* Venture profile card */
  .profile-card { background: var(--white); border: 1px solid var(--rule); border-radius: 20px; overflow: hidden; margin-bottom: 24px; }
  .profile-card-head { padding: 28px 32px; border-bottom: 1px solid var(--rule); display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; }
  .pc-name { font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 700; margin-bottom: 4px; }
  .pc-sector { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--purple-600); }
  .status-pill { padding: 6px 14px; border-radius: 100px; font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
  .status-draft { background: var(--purple-100); color: var(--purple-600); border: 1px solid var(--purple-200); }
  .status-published { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
  .steps-list { padding: 24px 32px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .step-item { padding: 16px; border: 1px solid var(--rule); border-radius: 12px; cursor: pointer; transition: all 0.2s; text-decoration: none; color: inherit; display: block; }
  .step-item:hover { border-color: var(--purple-200); background: var(--purple-100); }
  .step-item.complete { border-color: #bbf7d0; background: #f0fdf4; }
  .step-item.current { border-color: var(--purple-400); background: var(--purple-100); }
  .si-num { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-soft); margin-bottom: 4px; }
  .si-name { font-size: 13px; font-weight: 600; color: var(--text); }
  .si-badge { display: inline-block; margin-top: 6px; padding: 2px 8px; border-radius: 100px; font-size: 9px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
  .si-badge.done { background: #dcfce7; color: #166534; }
  .si-badge.next { background: var(--purple-100); color: var(--purple-600); }
  .si-badge.todo { background: var(--off); color: var(--text-soft); border: 1px solid var(--rule); }
  .profile-card-foot { padding: 20px 32px; border-top: 1px solid var(--rule); display: flex; gap: 12px; }

  /* Journey display */
  .journey-card { background: var(--white); border: 1px solid var(--rule); border-radius: 16px; padding: 28px 32px; margin-bottom: 24px; }
  .jc-label { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-soft); margin-bottom: 16px; }
  .jc-track { height: 8px; background: var(--purple-100); border-radius: 100px; position: relative; margin-bottom: 12px; }
  .jc-fill { height: 100%; background: linear-gradient(90deg, var(--purple-900), var(--purple-400)); border-radius: 100px; transition: width 1.2s ease; }
  .jc-stages { display: flex; justify-content: space-between; }
  .jc-stage { font-size: 9px; color: var(--text-soft); text-align: center; flex: 1; }
  .jc-stage.active { color: var(--purple-600); font-weight: 700; }
  .jc-stage-name { font-size: 15px; font-weight: 700; color: var(--purple-800); margin-top: 16px; }

  /* Admin section */
  .admin-section { background: var(--purple-900); border-radius: 20px; padding: 32px; color: white; margin-bottom: 24px; }
  .admin-section h3 { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 600; margin-bottom: 8px; }
  .admin-section p { font-size: 13px; color: rgba(255,255,255,0.6); margin-bottom: 20px; }
  .admin-actions { display: flex; gap: 12px; flex-wrap: wrap; }
  .admin-btn { padding: 10px 22px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; border: none; transition: all 0.2s; }
  .admin-btn.danger { background: #dc2626; color: white; }
  .admin-btn.danger:hover { background: #b91c1c; }
  .admin-btn.secondary { background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); }
  .admin-btn.secondary:hover { background: rgba(255,255,255,0.2); }
  .admin-result { font-size: 13px; color: rgba(255,255,255,0.7); margin-top: 12px; }

  .loading { text-align: center; padding: 80px; color: var(--text-soft); font-size: 14px; }
  @media(max-width:800px){ nav { padding: 0 20px; } .page { padding: 24px; } .cards-grid { grid-template-columns: 1fr 1fr; } .steps-list { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<nav>
  <a href="/index.html" class="nav-brand">
    <div class="nav-mark">R</div>
    <strong>Rhodes Ventures</strong>
  </a>
  <div class="nav-right">
    <span class="nav-user" id="nav-user"></span>
    <button class="nav-btn primary" onclick="window.location.href='/profile-builder.html'">Edit Profile</button>
    <button class="nav-btn" onclick="logout()">Sign Out</button>
  </div>
</nav>

<div class="page" id="page">
  <div class="loading">Loading your dashboard…</div>
</div>

<script src="/auth.js"></script>
<script>
requireAuth();

const STAGE_META = {};
const STEPS = [
  { num: 1, name: 'Basic Info',       fields: ['name','sector','tagline'] },
  { num: 2, name: 'Team',             fields: ['teamMembers'] },
  { num: 3, name: 'Journey & Evidence', fields: ['stage','stageDescription'] },
  { num: 4, name: 'Problem & Solution', fields: ['problem','solution'] },
  { num: 5, name: 'Business Model',   fields: ['bmc'] },
  { num: 6, name: 'Media & Links',    fields: [] },
];

function stepStatus(venture, step) {
  if (step.num < venture.lastStep) return 'done';
  if (step.num === venture.lastStep) return 'next';
  return 'todo';
}

function stepBadgeHtml(status) {
  const labels = { done: 'Complete', next: 'Continue here', todo: 'Not started' };
  return `<span class="si-badge ${status}">${labels[status]}</span>`;
}

function renderDashboard(user, venture, stageMeta) {
  const page = document.getElementById('page');
  document.getElementById('nav-user').textContent = `${user.firstName} ${user.lastName}`;

  const sm = stageMeta[venture.stage] || { label: 'Idea', pct: 8 };

  const prefillBanner = venture.prefilled
    ? `<div class="prefill-banner" id="prefill-banner">
        <p>We've added some initial information to your profile based on what we know about your venture. <strong>Please review, update, and complete your profile</strong> to make sure everything is accurate.</p>
        <a href="/profile-builder.html">Review Now →</a>
       </div>`
    : '';

  const adminSection = user.role === 'admin' ? `
    <div class="admin-section">
      <h3>Admin Controls</h3>
      <p>You are signed in as an administrator. Use these tools during test runs.</p>
      <div class="admin-actions">
        <button class="admin-btn secondary" onclick="window.location.href='/admin.html'">Manage All Ventures</button>
        <button class="admin-btn danger" onclick="clearTestData()">Clear All Test Data</button>
      </div>
      <div class="admin-result" id="admin-result"></div>
    </div>` : '';

  page.innerHTML = `
    ${prefillBanner}
    ${adminSection}
    <div class="dash-header">
      <h1 class="dash-greeting">Hello, ${user.firstName}.</h1>
      <p class="dash-sub">Your venture profile dashboard — ${venture.status === 'published' ? 'your venture is live in the directory' : 'complete your profile to go live'}.</p>
    </div>

    <div class="cards-grid">
      <div class="stat-card highlight">
        <div class="stat-label">Profile Complete</div>
        <div class="stat-val">${venture.completeness}%</div>
        <div class="stat-sub">${100 - venture.completeness}% remaining to fill in</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Current Stage</div>
        <div class="stat-val" style="font-size:22px;margin-top:4px">${sm.label}</div>
        <div class="stat-sub">Entrepreneurship journey position</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Directory Status</div>
        <div class="stat-val" style="font-size:22px;margin-top:4px">${venture.status === 'published' ? 'Live' : 'Draft'}</div>
        <div class="stat-sub">${venture.status === 'published' ? 'Visible to visitors' : 'Not yet visible — complete profile to publish'}</div>
      </div>
    </div>

    <div class="journey-card">
      <div class="jc-label">Your Entrepreneurship Journey</div>
      <div class="jc-track">
        <div class="jc-fill" style="width:0%" id="jc-fill"></div>
      </div>
      <div class="jc-stages">
        ${['Idea','Concept','Prototype','Testing','Pilot','Pre-Revenue','Early Rev.','Growth','Scale']
            .map((s,i) => `<div class="jc-stage ${Object.values(stageMeta)[i]?.pct <= sm.pct ? 'active' : ''}">${s}</div>`).join('')}
      </div>
      <div class="jc-stage-name">${sm.label} Stage</div>
    </div>

    <div class="profile-card">
      <div class="profile-card-head">
        <div>
          <div class="pc-name">${venture.name || 'Untitled Venture'}</div>
          <div class="pc-sector">${venture.sector || 'Sector not set'}</div>
        </div>
        <div class="status-pill ${venture.status === 'published' ? 'status-published' : 'status-draft'}">
          ${venture.status}
        </div>
      </div>
      <div class="steps-list">
        ${STEPS.map(s => {
          const status = stepStatus(venture, s);
          return `<a class="step-item ${status === 'done' ? 'complete' : status === 'next' ? 'current' : ''}"
            href="/profile-builder.html?step=${s.num}">
            <div class="si-num">Step ${s.num}</div>
            <div class="si-name">${s.name}</div>
            ${stepBadgeHtml(status)}
          </a>`;
        }).join('')}
      </div>
      <div class="profile-card-foot">
        <button class="nav-btn primary" onclick="window.location.href='/profile-builder.html?step=${venture.lastStep}'">
          Continue Profile →
        </button>
        ${venture.status !== 'published' && venture.completeness >= 60
          ? `<button class="nav-btn" onclick="publishNow()">Publish to Directory</button>`
          : ''}
        ${venture.status === 'published'
          ? `<button class="nav-btn" onclick="unpublish()">Unpublish</button>`
          : ''}
      </div>
    </div>
  `;

  // Animate journey fill
  setTimeout(() => {
    document.getElementById('jc-fill').style.width = sm.pct + '%';
  }, 100);
}

async function publishNow() {
  try {
    const data = await apiFetch('/api/ventures/mine/publish', { method: 'POST' });
    alert(data.message);
    location.reload();
  } catch (e) { alert(e.message); }
}

async function unpublish() {
  if (!confirm('Remove your venture from the public directory?')) return;
  try {
    await apiFetch('/api/ventures/mine/unpublish', { method: 'POST' });
    location.reload();
  } catch (e) { alert(e.message); }
}

async function clearTestData() {
  if (!confirm('Delete ALL test users and their ventures? This cannot be undone.')) return;
  try {
    const data = await apiFetch('/api/admin/test-data', { method: 'DELETE' });
    document.getElementById('admin-result').textContent = data.message;
    setTimeout(() => logout(), 2000); // log out since your own account may be gone
  } catch (e) { alert(e.message); }
}

// ─── Init ───────────────────────────────────────────────────────
(async () => {
  try {
    const { user, venture } = await apiFetch('/api/auth/me');
    const { stageMeta } = await apiFetch('/api/ventures/mine');
    renderDashboard(user, venture || {}, stageMeta);
  } catch (e) {
    logout();
  }
})();
</script>
</body>
</html>
