services:
  - type: web
    name: rhodes-ventures
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false          # Set this manually in Render dashboard
      - key: JWT_SECRET
        generateValue: true  # Render auto-generates a secure value
      - key: ADMIN_EMAIL
        sync: false          # Set this manually in Render dashboard